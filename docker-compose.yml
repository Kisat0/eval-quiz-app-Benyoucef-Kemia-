name: quiz-app

services:
  db:
    image: postgres:17.12-alpine
    container_name: quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER manquant dans .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB manquant dans .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    pids_limit: 200

  backend:
    build: ./backend
    image: quiz-backend:local
    container_name: quiz-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3007"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY manquant dans .env}"
      FROM_EMAIL: "${FROM_EMAIL}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?ADMIN_USERNAME manquant dans .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant dans .env}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-frontend:local
    container_name: quiz-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8087:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

volumes:
  pgdata: